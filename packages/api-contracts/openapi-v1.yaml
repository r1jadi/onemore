openapi: 3.1.0
info:
  title: onemore API
  version: "1.0.0"
  summary: The versioned HTTP API behind the onemore web app.
  description: |
    Every endpoint lives under `/api/v1`. The gateway owns `/api/v1` and routes
    each group to the service that implements it
    (`services/internal/apiroutes/routes.go`).

    ## Authorization tiers
    * **public** — no credentials.
    * **optional** — works anonymously, personalises when a valid token is sent.
    * **authenticated** — a verified Supabase access token is required. The
      caller's user id always comes from that token; it is never a parameter.
    * **moderator** / **admin** — an authenticated caller whose role, read from
      the token's `app_metadata.role`, is `moderator` or `admin`.

    ## Errors
    Failures always use the same envelope:

    ```json
    { "error": { "code": "forbidden", "message": "...", "request_id": "..." } }
    ```

    Codes: `bad_request`, `unauthorized`, `forbidden`, `not_found`, `conflict`,
    `unprocessable_entity`, `rate_limited`, `payload_too_large`,
    `unsupported_media_type`, `not_implemented`, `service_unavailable`,
    `timeout`, `internal_error`.

    ## Implementation status
    Operations carry `x-status`. `available` means the endpoint is implemented and
    behaves as documented. `planned` means the route exists, is authorized and
    rate limited, and answers `501 not_implemented` until the feature task that
    owns it lands, so clients can be written against this contract today without
    guessing at the final shape.

    ## Conventions
    * JSON in, JSON out. Unknown request fields are rejected.
    * Request bodies are limited to 1 MiB unless stated otherwise.
    * Idempotency: `POST` creates, `PATCH` updates a subset, `DELETE` removes.
    * Lists are cursor paginated with a bounded page size (`limit`, `cursor`).
  contact:
    name: onemore
    url: https://onemorestartup.vercel.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: https://onemorestartup.vercel.app/api/v1
    description: Production
  - url: http://localhost:8080/api/v1
    description: Local gateway

tags:
  - name: auth
    description: |
      The credential lifecycle on top of Supabase Auth. Supabase stores the
      credentials and issues the tokens; this group owns the application session.
      Credential and token bodies are limited to 8 KiB, and the endpoints that
      verify a password are throttled per client and per account.
  - name: users
    description: Player profiles.
  - name: games
    description: Game catalogue.
  - name: sessions
    description: Play sessions; the only path to a score.
  - name: scores
    description: Score records and personal bests.
  - name: leaderboards
    description: Global and friends boards.
  - name: feed
    description: The personalised game feed.
  - name: recommendations
    description: Suggested games.
  - name: social
    description: Comments, follows and likes.
  - name: notifications
    description: In-app and push notifications.
  - name: search
    description: Game, creator and player search.
  - name: moderation
    description: Reports and moderation actions.
  - name: analytics
    description: Product analytics.
  - name: admin
    description: Operations API behind the admin dashboard.
  - name: health
    description: Liveness of the gateway itself, for uptime checks and deployments.

security:
  - bearerAuth: []

paths:
  /:
    get:
      operationId: getApiVersion
      tags: [admin]
      summary: Report the API version
      security: []
      x-status: available
      responses:
        "200":
          description: Version discovery for clients and probes.
          content:
            application/json:
              schema:
                type: object
                required: [apiVersion, version]
                properties:
                  apiVersion: { type: string, const: v1 }
                  version: { type: string, example: 0.1.0 }
                  commit: { type: string, example: 9f2c1ab }

  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Report that the gateway is serving requests
      description: |
        Liveness of the deployed gateway itself, not of anything behind it: it
        verifies no token, opens no database connection and calls no upstream, so
        it answers `200` even while every backend service is unimplemented and
        answers `501`. Readiness — which does run dependency checks — is the
        unversioned `/readyz`, and orchestrators keep using `/healthz` and
        `/readyz`.
      security: []
      x-status: available
      responses:
        "200":
          description: The gateway is serving requests.
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, const: ok }
                  version: { type: string, example: 0.1.0 }
        "503":
          description: The process is draining, so it must receive no new traffic.

  /auth/sign-up:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create an account
      description: |
        Creates the account in Supabase Auth and returns the new session.

        This service stores no credential: the password is forwarded to Supabase,
        which applies the project's own password policy, sends the confirmation
        mail and creates the profile row through its `handle_new_user` trigger.

        When the project requires email confirmation no session exists until the
        address is confirmed, so that response carries `user` and no `tokens`.
      security: []
      x-status: available
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, minLength: 3, maxLength: 254 }
                password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        "201":
          description: |
            The account was created. `tokens` is present when Supabase issued a
            session, and omitted while email confirmation is pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /auth/sign-in:
    post:
      operationId: signIn
      tags: [auth]
      summary: Sign in with an email and password
      description: |
        Verifies the credential against Supabase Auth and returns the session.

        A wrong password and an unknown address answer identically, and the reason
        is never echoed: nothing here reveals whether an account exists.
      security: []
      x-status: available
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, minLength: 3, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 72 }
      responses:
        "200":
          description: The credential matched, and the session is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The credential is right but the address is not confirmed yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Exchange a refresh token for a new session
      description: |
        Rotates the Supabase session and returns both tokens again.

        The refresh token travels in the body of a `POST`, never in a query
        string, so it stays out of access logs and browser history. A token
        Supabase no longer recognises answers `401`, which the client should treat
        as "sign in again".
      security: []
      x-status: available
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken: { type: string, minLength: 1, maxLength: 8192 }
      responses:
        "200":
          description: The session was rotated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /auth/session:
    post:
      operationId: createSession
      tags: [auth]
      summary: Exchange a Supabase access token for the application session
      description: |
        Returns the application's view of a session — role, onboarding state,
        expiry — for a Supabase access token the caller already holds. That is how
        a client which just finished a Supabase-side flow (an emailed link, an
        OAuth redirect) asks for the session it does not hold yet.

        The token is verified exactly as on every other authenticated route: a
        JWKS-checked signature plus issuer, audience and expiry. It is the only
        auth route reachable without a bearer token, and it returns no token of
        its own.
      security: []
      x-status: available
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accessToken]
              properties:
                accessToken: { type: string, minLength: 1, maxLength: 8192 }
      responses:
        "200":
          description: The session belonging to that token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      operationId: getSession
      tags: [auth]
      summary: Read the current session
      description: |
        Reports the session of the caller whose bearer token the shared auth
        middleware verified. The user id, role and email come from that token and
        are never parameters.
      x-status: available
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /auth/sign-out:
    post:
      operationId: signOut
      tags: [auth]
      summary: Revoke the current session
      description: |
        Revokes the presented Supabase session, so its refresh token can no longer
        mint an access token. The access token itself stays verifiable until it
        expires, so the client discards it too.

        Retrying is safe: revoking an already-revoked session is a success, which
        lets a client finish signing out after a dropped response.
      x-status: available
      responses:
        "204": { description: The session is revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /users/me:
    get:
      operationId: getMyProfile
      tags: [users]
      summary: Read the signed-in profile
      description: |
        The profile of the caller, resolved from the verified token. There is no
        parameter that addresses anyone else: the identity is never read from the
        body, a query value or a header. `role` comes from the same verified token
        `/auth/session` reports, so the two endpoints cannot disagree.
      x-status: available
      responses:
        "200":
          description: The profile of the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: |
            The account has no profile row. Every account gets one from the
            `handle_new_user` trigger, so this is a genuinely missing profile
            rather than an empty state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      operationId: updateMyProfile
      tags: [users]
      summary: Update the signed-in profile
      description: |
        Only presentation fields are writable: `username`, `role`,
        `is_suspended` and the timestamps are **rejected**, not ignored — the
        refusal names the field. The database enforces the same rule a second
        time: the UPDATE grant on `profiles` covers `display_name`, `bio`,
        `avatar_path` and `onboarded_at` only, so a request that got past this
        service still could not write a role.

        Concurrency is opt-in. Send back the `updatedAt` you read and the write
        applies only if the row still holds that value; otherwise it is refused
        with `409 conflict` rather than overwriting a change you never saw.
        Omitting `expectedUpdatedAt` accepts last-write-wins, which is why a
        client that cares about concurrent edits should always send it.
      x-status: available
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                displayName: { type: string, minLength: 1, maxLength: 60 }
                bio:
                  type: [string, "null"]
                  maxLength: 300
                  description: A null clears the field; omitting it leaves it.
                avatarPath:
                  type: [string, "null"]
                  maxLength: 160
                  description: |
                    `"<account id>/<file name>"`, the object path inside the
                    caller's own storage prefix. A null (or an empty string)
                    clears it; omitting it leaves it.
                expectedUpdatedAt:
                  type: string
                  format: date-time
                  description: |
                    The `updatedAt` of the profile this edit is based on. Omit it
                    to accept last-write-wins.
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            The database refused the write: the caller tried to change a column
            the UPDATE grant excludes, or Row Level Security refused the row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: The account has no profile row to update.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >-
            The profile changed since the caller read it, so `expectedUpdatedAt`
            no longer matches. The body still exists; reload and retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /users/{userID}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: getPublicProfile
      tags: [users]
      summary: Read a public profile
      security: []
      x-status: planned
      responses:
        "200":
          description: Public profile fields only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicProfile" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /games:
    get:
      operationId: listGames
      tags: [games]
      summary: Browse the catalogue
      description: |
        A page of published games, newest first. An unpublished game is never
        included: the endpoint reads through the database's RLS policies as an
        anonymous caller, so a draft, a game under review or a restricted game is
        absent from the result rather than filtered out here.

        Ordering is recency, which is the only order the catalogue can compute
        from real data. `popular` and `trending` need play counts and no service
        records plays yet, so `sort` accepts only `latest` instead of pretending a
        ranking exists.

        No response carries a play count, rating, like total, comment total or
        average session duration. None of them can be derived from stored
        activity today, and a fabricated number is indistinguishable from a real
        one on screen.
      security: []
      x-status: available
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: category
          in: query
          description: A category slug, as returned by `GET /categories`. A well-formed slug that names no category is an empty page, not an error.
          schema: { type: string, pattern: "^[a-z0-9-]{2,32}$" }
        - name: q
          in: query
          description: |
            Case-insensitive substring match over a game's title, tagline and
            description. The characters the filter grammar uses structurally
            (`,` `(` `)` `*` `"` `\`) are ignored rather than searched for.
          schema: { type: string, maxLength: 100 }
        - name: sort
          in: query
          description: |
            The only order the catalogue can compute from real data. Any other
            value is a `400`: ranking by popularity or trend needs play counts
            that do not exist yet.
          schema: { type: string, enum: [latest] }
      responses:
        "200":
          description: A page of published games.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      operationId: createGame
      tags: [games]
      summary: Create a game
      description: The owner is taken from the token; a body field cannot set it.
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GameCreate" }
      responses:
        "201":
          description: The created game.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Game" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /games/{slug}:
    parameters:
      - $ref: "#/components/parameters/GameSlug"
    get:
      operationId: getGame
      tags: [games]
      summary: Read a game
      description: |
        One published game, found by its slug — the same identifier the web app
        puts in its URLs (`/games/stack-10`), so a link stays stable across a
        redeploy.

        An unknown slug and an unpublished game answer the same `404`: telling
        them apart would let a stranger enumerate drafts.
      security: []
      x-status: available
      responses:
        "200":
          description: The published game.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Game" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      operationId: updateGame
      tags: [games]
      summary: Update an owned game
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GameUpdate" }
      responses:
        "200":
          description: The updated game.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Game" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /categories:
    get:
      operationId: listCategories
      tags: [games]
      summary: List categories with their real published-game counts
      description: |
        Every category, with the real number of published games in it. A category
        that holds nothing yet is present with a count of `0`, which is an answer:
        the category exists and is empty.

        The count comes from a database view that filters on `status =
        'published'` inside its own definition, so a draft never contributes — not
        even when the caller is the draft's owner.
      security: []
      x-status: available
      responses:
        "200":
          description: Every category, ordered by the catalogue's own sort order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryList" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /sessions:
    post:
      operationId: startSession
      tags: [sessions]
      summary: Start a play session
      description: |
        The server owns the session id and (where the game needs one) the seed.
        A session is the precondition for submitting a score.
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [gameId]
              properties:
                gameId: { type: string, format: uuid }
                client: { type: string, maxLength: 40, example: web/1.0 }
      responses:
        "201":
          description: The open session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /sessions/{sessionID}/complete:
    parameters:
      - name: sessionID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: completeSession
      tags: [sessions]
      summary: Complete a play session and record the score
      description: |
        The session must belong to the caller and still be open. Progress is
        validated server-side before a score exists.
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [score]
              properties:
                score: { type: integer, minimum: 0 }
                durationMs: { type: integer, minimum: 1 }
                progress:
                  type: object
                  description: "Game-defined payload, validated per game."
                  additionalProperties: true
      responses:
        "200":
          description: The recorded score.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Score" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /scores/me:
    get:
      operationId: getMyScores
      tags: [scores]
      summary: Read your scores and personal bests
      x-status: planned
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of scores.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Score" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /scores/{scoreID}:
    parameters:
      - name: scoreID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getScore
      tags: [scores]
      summary: Read a score
      security: []
      x-status: planned
      responses:
        "200":
          description: The score.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Score" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /leaderboards:
    get:
      operationId: listLeaderboards
      tags: [leaderboards]
      summary: List available boards
      security: []
      x-status: planned
      responses:
        "200":
          description: Board summaries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Leaderboard" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /leaderboards/{boardID}:
    parameters:
      - name: boardID
        in: path
        required: true
        schema: { type: string, pattern: "^[a-z0-9-]{2,48}$" }
    get:
      operationId: getLeaderboard
      tags: [leaderboards]
      summary: Read a board
      security: []
      x-status: planned
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Ranked entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope: { type: string, enum: [global, friends] }
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/LeaderboardEntry" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /feed:
    get:
      operationId: getFeed
      tags: [feed]
      summary: Read the game feed
      x-status: planned
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of feed items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Game" }
                  nextCursor: { type: [string, "null"] }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /recommendations:
    get:
      operationId: getRecommendations
      tags: [recommendations]
      summary: Read personalised game suggestions
      description: |
        Derived from the caller's own history when a token is present, from the
        public ranking otherwise. Taste data is never accepted from the client.
      x-status: planned
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A ranked list of games.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Game" }
                  reason:
                    type: string
                    description: Why these games were chosen, for display.
        "501": { $ref: "#/components/responses/NotImplemented" }

  /recommendations/feedback:
    post:
      operationId: recordRecommendationFeedback
      tags: [recommendations]
      summary: Record feedback on a suggestion
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [gameId, signal]
              properties:
                gameId: { type: string, format: uuid }
                signal: { type: string, enum: [more_like_this, less_like_this, hidden] }
      responses:
        "204": { description: Feedback recorded. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /comments:
    get:
      operationId: listComments
      tags: [social]
      summary: List comments for a game
      security: []
      x-status: planned
      parameters:
        - name: gameId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of comments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    post:
      operationId: createComment
      tags: [social]
      summary: Comment on a game
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [gameId, body]
              properties:
                gameId: { type: string, format: uuid }
                body: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "201":
          description: The created comment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /likes:
    post:
      operationId: createLike
      tags: [social]
      summary: Like a game or comment
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetKind, targetId]
              properties:
                targetKind: { type: string, enum: [game, comment] }
                targetId: { type: string, format: uuid }
      responses:
        "204": { description: Like recorded. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /follows:
    post:
      operationId: createFollow
      tags: [social]
      summary: Follow a user
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username]
              properties:
                username: { type: string, pattern: "^[a-z0-9_]{3,24}$" }
      responses:
        "204": { description: Follow recorded. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List your notifications
      x-status: planned
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of notifications.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /search:
    get:
      operationId: search
      tags: [search]
      summary: Search games, creators and players
      security: []
      x-status: planned
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 80 }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Search results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  games:
                    type: array
                    items: { $ref: "#/components/schemas/Game" }
                  players:
                    type: array
                    items: { $ref: "#/components/schemas/PublicProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /moderation/reports:
    get:
      operationId: listReports
      tags: [moderation]
      summary: Read the report queue
      x-status: planned
      security:
        - bearerAuth: []
          # moderator or admin
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of reports.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Report" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    post:
      operationId: createReport
      tags: [moderation]
      summary: Report content
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetKind, targetId, reason]
              properties:
                targetKind: { type: string, enum: [game, comment, profile] }
                targetId: { type: string, format: uuid }
                reason: { type: string, minLength: 3, maxLength: 80 }
                details: { type: string, maxLength: 1000 }
      responses:
        "201":
          description: The created report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /analytics/events:
    post:
      operationId: recordEvent
      tags: [analytics]
      summary: Record a product analytics event
      description: |
        Event names are validated against an allowlist and properties against a
        size limit. The user id comes from the token when one is present.
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, pattern: "^[a-z][a-z0-9_.]{2,63}$" }
                properties: { type: object, additionalProperties: true }
      responses:
        "204": { description: Event accepted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List users
      x-status: planned
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of accounts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Profile" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { $ref: "#/components/responses/NotImplemented" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase access token. Verified against the project's JWKS (ES256/RS256)
        or, for legacy projects, the HS256 secret. `service_role` tokens are
        rejected on every user-facing route.

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 200 }
    UserID:
      name: userID
      in: path
      required: true
      schema: { type: string, format: uuid }
    GameSlug:
      name: slug
      in: path
      required: true
      description: The game's stable public identifier, matching its web URL.
      schema: { type: string, pattern: "^[a-z0-9-]{2,48}$" }

  responses:
    BadRequest:
      description: The request was malformed or missing a required value.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, expired or invalid credentials.
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated, but not allowed to perform this action.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource — or none the caller may know about.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: Well-formed input that failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: The caller exceeded its budget.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: A dependency of this endpoint is not configured or not reachable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: The request body is larger than the endpoint accepts.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotImplemented:
      description: The route exists and is authorized but is not implemented yet.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - bad_request
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - unprocessable
                - rate_limited
                - payload_too_large
                - unsupported
                - not_implemented
                - unavailable
                - timeout
                - internal
            message: { type: string }
            request_id: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  rule: { type: string }
    Session:
      type: object
      required: [userId, role]
      description: |
        The application's view of a session, built from a verified token. It
        carries no token of its own: only what a screen needs to render.
      properties:
        userId: { type: string, format: uuid }
        role: { type: string, enum: [user, moderator, admin] }
        email: { type: string, format: email }
        onboarded:
          type: boolean
          description: |
            Omitted when it could not be read. `false` means the caller has not
            finished onboarding, which is an answer; a failed read is not, and
            reporting one as the other would restart onboarding.
        expiresAt: { type: string, format: date-time }
    AuthSession:
      type: object
      required: [session]
      description: What the credential and refresh endpoints return.
      properties:
        session: { $ref: "#/components/schemas/Session" }
        tokens: { $ref: "#/components/schemas/Tokens" }
        user: { $ref: "#/components/schemas/AuthUser" }
    Tokens:
      type: object
      required: [accessToken, refreshToken, tokenType]
      description: |
        The Supabase token pair, returned only to the caller that earned it, in a
        response marked `no-store`. The refresh token is a credential: a client
        keeps it out of anything a page could read back. Omitted while email
        confirmation is pending, when no session exists yet.
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, example: bearer }
        expiresAt: { type: string, format: date-time }
        expiresIn:
          type: integer
          minimum: 0
          description: Lifetime of `accessToken` in seconds.
    AuthUser:
      type: object
      required: [id, email, emailConfirmed, createdAt]
      description: The Supabase user record, trimmed to what the app shows.
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        emailConfirmed: { type: boolean }
        createdAt: { type: string, format: date-time }
    Profile:
      type: object
      required: [id, username, displayName, role, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string, pattern: "^[a-z0-9_]{3,24}$" }
        displayName: { type: string }
        bio: { type: [string, "null"] }
        avatarPath: { type: [string, "null"] }
        role: { type: string, enum: [user, moderator, admin] }
        onboardedAt:
          type: [string, "null"]
          format: date-time
          description: Null until the user finishes onboarding.
        createdAt: { type: string, format: date-time }
        updatedAt:
          type: string
          format: date-time
          description: >-
            Changes on every write. Send it back as `expectedUpdatedAt` to make
            a PATCH conditional on this exact version. The projection
            deliberately omits `is_suspended`: the SELECT grant excludes it, so
            no response can carry it.
    PublicProfile:
      type: object
      required: [id, username, displayName]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        bio: { type: [string, "null"] }
        avatarPath: { type: [string, "null"] }
        followers: { type: integer, minimum: 0 }
        following: { type: integer, minimum: 0 }
    Game:
      type: object
      required: [slug, title, playable, isOfficial, updatedAt]
      description: |
        A published game as the catalogue exposes it.

        Deliberately absent: `id` (a slug is the public identifier and the uuid is
        internal), `ownerId` (there is no public profile endpoint to resolve it
        into a name) and every activity metric — plays, likes, comments, saves,
        ratings, average session and ranking. None of those can be derived from
        stored activity yet, and shipping a plausible-looking zero would be
        indistinguishable from a real measurement.
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9-]{2,48}$"
          description: The stable public identifier, matching the web URL `/games/<slug>`.
        title: { type: string, maxLength: 80 }
        tagline: { type: [string, "null"] }
        description: { type: [string, "null"] }
        instructions:
          type: [string, "null"]
          description: How to play. Null while a game has no written rules.
        category:
          oneOf:
            - $ref: "#/components/schemas/CategoryRef"
            - type: "null"
          description: Null when the game is not in a category.
        runtime:
          type: [string, "null"]
          description: |
            The client runtime that plays this game, or null when none exists.
            `playable` is `false` for every game until a runtime ships.
        playable:
          type: boolean
          description: |
            True only when `runtime` names a runtime that actually exists. A
            published but unplayable game is listed, not playable, and the UI must
            not offer to start it.
        isOfficial:
          type: boolean
          description: First-party OneMore content, as opposed to a creator's.
        coverPath:
          type: [string, "null"]
          description: |
            Storage object path (`<slug>/<file>`) inside the public `game-assets`
            bucket, not a URL. Null until real art is uploaded.
        publishedAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: string, format: date-time }
    CategoryRef:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, pattern: "^[a-z0-9-]{2,32}$" }
        name: { type: string, maxLength: 40 }
    Category:
      type: object
      required: [slug, name, gameCount]
      properties:
        slug: { type: string, pattern: "^[a-z0-9-]{2,32}$" }
        name: { type: string, maxLength: 40 }
        description: { type: [string, "null"] }
        gameCount:
          type: integer
          minimum: 0
          description: Published games in this category. Real, and counted in the database.
    GameList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Game" }
        nextCursor:
          type: [string, "null"]
          description: |
            Opaque cursor for the next page, or null on the last page. Pass it
            back as `cursor`; do not construct one.
    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Category" }
    GameCreate:
      type: object
      additionalProperties: false
      required: [slug, title]
      properties:
        slug: { type: string, pattern: "^[a-z0-9-]{2,48}$" }
        title: { type: string, minLength: 1, maxLength: 80 }
        tagline: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        categoryId: { type: string, format: uuid }
    GameUpdate:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        tagline: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        categoryId: { type: string, format: uuid }
    GameSession:
      type: object
      required: [id, gameId, startedAt]
      properties:
        id: { type: string, format: uuid }
        gameId: { type: string, format: uuid }
        seed: { type: integer, format: int64 }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
    Score:
      type: object
      required: [id, gameId, userId, score, createdAt]
      properties:
        id: { type: string, format: uuid }
        gameId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        score: { type: integer, minimum: 0 }
        durationMs: { type: [integer, "null"], minimum: 1 }
        createdAt: { type: string, format: date-time }
    Leaderboard:
      type: object
      required: [id, gameId, scope]
      properties:
        id: { type: string }
        gameId: { type: string, format: uuid }
        scope: { type: string, enum: [global, friends, daily] }
        updatedAt: { type: string, format: date-time }
    LeaderboardEntry:
      type: object
      required: [rank, userId, score]
      properties:
        rank: { type: integer, minimum: 1 }
        userId: { type: string, format: uuid }
        username: { type: string }
        score: { type: integer, minimum: 0 }
        achievedAt: { type: string, format: date-time }
    Comment:
      type: object
      required: [id, gameId, authorId, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        gameId: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        body: { type: string, maxLength: 2000 }
        createdAt: { type: string, format: date-time }
        editedAt: { type: [string, "null"], format: date-time }
    Notification:
      type: object
      required: [id, kind, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [follow, comment, like, score, moderation, system] }
        payload: { type: object, additionalProperties: true }
        readAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    Report:
      type: object
      required: [id, targetKind, targetId, reason, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        targetKind: { type: string, enum: [game, comment, profile] }
        targetId: { type: string, format: uuid }
        reason: { type: string }
        details: { type: [string, "null"] }
        status: { type: string, enum: [open, reviewing, resolved, dismissed] }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, "null"], format: date-time }
